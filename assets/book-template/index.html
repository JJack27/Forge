<!doctype html>
<!--
  Personal Book Forger — book project entry point.
  -----------------------------------------------
  This is a multi-file project. Open it over HTTP, not via file://
  (the browser blocks fetch() of local JSON otherwise).

  Quick start:
    cd <this project directory>
    python3 -m http.server 8000
    open http://localhost:8000

  Or run ./start.sh which does the same.

  Set BOOK_SLUG in js/main.js to a unique kebab-case id for this book
  (used as the localStorage key prefix for test scores).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BOOK TITLE}}</title>
<link rel="stylesheet" href="css/book.css">
</head>
<body>
<div class="layout">

  <nav id="toc">
    <!-- TOC chapter links are rendered here by dashboard.js; the language switcher is appended at the bottom. -->
    <h2>Contents</h2>
  </nav>

  <main id="app">
    <header id="dashboard">
      <h1>{{BOOK TITLE}}</h1>
      <p class="subtitle">{{subtitle}}</p>
      <div class="progress-bar"><div id="overall-progress" style="width:0%"></div></div>
      <div class="chapter-status-grid" id="status-grid"></div>
    </header>

    <p id="boot-msg">Loading book…</p>
    <!-- Chapters are injected here by main.js after the dashboard header. -->
  </main>

</div>

<script src="js/vendor/d3.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/scoring.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/viz.js"></script>
<script src="js/main.js"></script>
</body>
</html>
